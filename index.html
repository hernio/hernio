<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belut Goreng Krispi - Cuma 20 Ribu!</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #F59E0B;
            --dark: #1C1917;
            --light: #FFFBEB;
            --green: #25D366;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        body { background-color: var(--light); color: var(--dark); line-height: 1.6; }

        /* Hero Section */
        .hero {
            min-height: 100vh; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; text-align: center;
            padding: 2rem 1rem; position: relative; overflow: hidden;
        }
        
        .badge-promo {
            background: var(--gold); color: white; padding: 8px 20px;
            border-radius: 50px; font-weight: 800; font-size: 0.9rem;
            margin-bottom: 1.5rem; animation: pulse 2s infinite;
        }

        h1 { font-size: 3rem; font-weight: 800; line-height: 1.1; margin-bottom: 1rem; max-width: 600px; }
        h1 span { color: var(--gold); display: block; font-size: 4rem; }
        
        .desc { font-size: 1.1rem; color: #57534E; max-width: 500px; margin-bottom: 2rem; }

        .price-tag {
            font-size: 2.5rem; font-weight: 800; color: var(--dark);
            margin-bottom: 2rem; display: flex; align-items: baseline; gap: 10px;
        }
        .price-tag small { font-size: 1rem; font-weight: 400; color: #78716C; text-decoration: line-through; }

        /* Tombol Beli Gede */
        .btn-beli {
            background: var(--green); color: white; text-decoration: none;
            padding: 18px 40px; border-radius: 16px; font-size: 1.2rem;
            font-weight: 700; display: inline-flex; align-items: center; gap: 10px;
            box-shadow: 0 10px 25px rgba(37, 211, 102, 0.4); transition: 0.3s;
            border: none; cursor: pointer;
        }
        .btn-beli:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 15px 30px rgba(37, 211, 102, 0.5); }

        /* Fitur Cepat */
        .features {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem;
            max-width: 600px; width: 100%; margin-top: 3rem;
        }
        .feat-item { background: white; padding: 1rem; border-radius: 12px; font-size: 0.85rem; font-weight: 600; }
        .feat-icon { font-size: 1.5rem; margin-bottom: 0.5rem; display: block; }

        /* Gambar Produk Placeholder */
        .product-img {
            width: 280px; height: 280px; background: #ddd; border-radius: 50%;
            margin: 2rem auto; display: flex; align-items: center; justify-content: center;
            font-size: 4rem; border: 8px solid white; box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            background-image: url('https://images.unsplash.com/photo-1626082927389-6cd097cdc6ec?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80');
            background-size: cover; background-position: center;
        }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        @media (max-width: 600px) {
            h1 { font-size: 2.2rem; } h1 span { font-size: 3rem; }
            .features { grid-template-columns: 1fr; }
            .btn-beli { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <section class="hero">
        <div class="badge-promo">🔥 PROMO HARI INI</div>
        
        <!-- GANTI FOTO PRODUK DI BAGIAN CSS .product-img -->
        <div class="product-img"></div> 

        <h1>Belut Goreng Krispi <span>Rp 20.000</span></h1>
        
        <p class="desc">
            Renyah tahan lama, bumbu meresap sampai tulang. 
            Tanpa amis, tanpa pengawet. Cocok buat lauk nasi hangat atau teman nonton drakor!
        </p>

        <div class="price-tag">
            <small>Rp 35.000</small> Rp 20.000 / bungkus
        </div>

        <!-- GANTI NOMOR WA DI BAWAH INI -->
        <a href="#" onclick="orderNow()" class="btn-beli">
            🛒 Pesan Sekarang via WA
        </a>

        <div class="features">
            <div class="feat-item"><span class="feat-icon">⚡</span>Digoreng Dadakan</div>
            <div class="feat-item"><span class="feat-icon">📦</span>Packing Vakum Aman</div>
            <div class="feat-item"><span class="feat-icon">💯</span>Garansi Rasa</div>
        </div>
    </section>

    <script>
        function orderNow() {
            // GANTI NOMOR INI DENGAN NOMOR WA KAMU (Format: 628xxx)
            const nomorWA = "6281234567890"; 
            
            const pesan = `Halo kak, saya mau pesan *Belut Goreng Krispi* promo Rp 20.000 nya. Masih ready kah?`;
            window.open(`https://wa.me/${nomorWA}?text=${encodeURIComponent(pesan)}`, '_blank');
        }
    </script>

</body>
</html>
